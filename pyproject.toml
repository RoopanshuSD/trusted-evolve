[project]
name = "trusted-evolve"
version = "0.1.0"
description = "Evolutionary search with a trusted evaluator on AlphaEvolve's circle packing, plus a multi-seed study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tevolve*"]
